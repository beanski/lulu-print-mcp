name: Lulu spec drift

# Weekly check that Lulu hasn't changed its published API spec.
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Exit code 1 means the spec changed; 2 means the download failed,
      # which fails the run without opening an issue.
      - id: check
        run: |
          set +e
          node scripts/check-spec.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - if: failure() && steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Lulu's API spec has changed"
          if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
            gh issue create --title "$title" --body "The weekly check found that https://api.lulu.com/api-docs/openapi-specs/openapi_public.yml no longer matches spec/openapi_public.yml.

          1. Run \`npm run spec:check -- --update\`
          2. Run \`npm test\`: the contract tests list every tool that no longer matches
          3. Update the tools, tests and CHANGELOG, then release"
          fi
