name: Release

# Publishes to npm when a GitHub release is published.
# The very first publish needs an NPM_TOKEN repository secret. After that,
# set up npm trusted publishing for this workflow and delete the secret:
# npm then authenticates with GitHub's OIDC token instead.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: test "v$(node -p 'require("./package.json").version')" = "${{ github.event.release.tag_name }}"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
