name: Release

# Publishes the version in package.json to npm, then creates the matching
# GitHub release (and its tag). Start it either way:
# - push a version tag such as v1.0.1 (it must match package.json), or
# - run it from the Actions tab ("Run workflow") on main; it tags main itself.
#
# The very first publish needs an NPM_TOKEN repository secret. After that,
# set up npm trusted publishing for this workflow and delete the secret:
# npm then authenticates with GitHub's OIDC token instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Work out the release tag
        id: tag
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$tag" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match package.json ($tag)"; exit 1; }
          else
            test "$GITHUB_REF_NAME" = "main" || { echo "Run this from main"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists: bump the version in package.json first"; exit 1
            fi
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          awk -v v="## ${tag#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$tag" --title "$tag" --notes-file notes.md --target "$GITHUB_SHA"
