name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev

  sandbox:
    # Live tests against Lulu's sandbox. Skipped on forks, which can't read secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:sandbox
        env:
          LULU_SANDBOX_CLIENT_KEY: ${{ secrets.LULU_SANDBOX_CLIENT_KEY }}
          LULU_SANDBOX_CLIENT_SECRET: ${{ secrets.LULU_SANDBOX_CLIENT_SECRET }}
